<title>Email Campaign Checklist</title></head>
<body class="bg-slate-100 font-sans text-slate-800">
<div class="bg-slate-900 text-white px-6 py-4 border-b border-slate-700">
<h1 class="text-2xl font-black text-emerald-400">EMAIL OUTREACH PRE-LAUNCH CHECKLIST</h1>
<p class="text-sm text-slate-400">Companion tab for GompaTech Outreach Playbook</p>
</div>
<div class="max-w-6xl mx-auto p-4">
<div class="grid md:grid-cols-2 gap-3">
<div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">1. Technical Setup</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> SPF/DKIM/DMARC verified</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Reply-To → siddharth@gompatech.com</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Test Gmail/Outlook/iCloud inboxes</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Reply flow tested</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Continue warm-up while ramping volume</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">2. Identity</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> Founder / Principal Consultant title</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Plain domain only: gompatech.com</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> No logos/social links/Calendly</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Location: Indore, India</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">3. Compliance</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> Text opt-out line</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Corporate emails only</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Record opt-outs immediately</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">4. Target List</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> Verify every email</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> No info@/sales@ mailboxes</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Target Teamcenter users</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> One personalized sentence</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">5. Sending</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> 5→10→15→20 gradual ramp</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Randomize send times</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> One recipient per email</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> No attachments</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> <120 words</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">6. Follow-up</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> Day 0 / 4 / 10 / 18</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Max 4 touches</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Move active conversations to primary mailbox</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">7. Metrics</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> Track replies, meetings, bounces</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Stop if bounce >3%</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Review any spam complaint immediately</label></li></ul></div><div class="bg-white border border-slate-200 rounded-lg p-3"><h2 class="font-bold text-emerald-700 text-sm mb-2">8. Messaging Rules</h2><ul class="space-y-1"><li class="text-sm"><label><input type="checkbox" class="mr-2"> One pain point/email</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Optimize for conversations</label></li><li class="text-sm"><label><input type="checkbox" class="mr-2"> Rotate subject/opening every few weeks</label></li></ul></div></div></div></body></html>
